---
- name: Find the release currently running
  ansible.builtin.stat:
    path: "{{ app_root }}/current"
  register: app_release_current

- name: Skip instances already on this release
  ansible.builtin.meta: end_host
  when: (app_release_current.stat.lnk_target | default('') | basename) == release_version

- name: Take the instance out of the target group
  ansible.builtin.command: >-
    aws elbv2 deregister-targets --region {{ aws_region }}
    --target-group-arn {{ target_group_arn }} --targets Id={{ instance_id }}
  delegate_to: localhost
  become: false
  changed_when: true

- name: Wait for in-flight requests to drain
  ansible.builtin.command: >-
    aws elbv2 wait target-deregistered --region {{ aws_region }}
    --target-group-arn {{ target_group_arn }} --targets Id={{ instance_id }}
  delegate_to: localhost
  become: false
  changed_when: false

- name: Download the release
  ansible.builtin.command: >-
    aws s3 cp --only-show-errors --region {{ aws_region }}
    s3://{{ artifact_bucket }}/releases/app-{{ release_version }}.tar.gz
    /tmp/app-{{ release_version }}.tar.gz
  args:
    creates: /tmp/app-{{ release_version }}.tar.gz

- name: Create the release directory
  ansible.builtin.file:
    path: "{{ app_root }}/releases/{{ release_version }}"
    state: directory
    owner: app
    group: app
    mode: "0755"

- name: Unpack the release
  ansible.builtin.unarchive:
    src: /tmp/app-{{ release_version }}.tar.gz
    dest: "{{ app_root }}/releases/{{ release_version }}"
    remote_src: true
    owner: app
    group: app

- name: Switch to the new release
  ansible.builtin.file:
    src: "{{ app_root }}/releases/{{ release_version }}"
    dest: "{{ app_root }}/current"
    state: link

- name: Restart the application
  ansible.builtin.systemd_service:
    name: app
    state: restarted

- name: Wait for the local health check
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_health_path }}"
  register: app_release_health
  until: app_release_health.status == 200
  retries: "{{ app_release_health_retries }}"
  delay: "{{ app_release_health_delay }}"

- name: Check the instance serves the new release
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/"
    return_content: true
  register: app_release_root
  failed_when: app_release_root.json.version | default('') != release_version

- name: Put the instance back in the target group
  ansible.builtin.command: >-
    aws elbv2 register-targets --region {{ aws_region }}
    --target-group-arn {{ target_group_arn }} --targets Id={{ instance_id }}
  delegate_to: localhost
  become: false
  changed_when: true

- name: Wait until the ALB reports the instance healthy
  ansible.builtin.command: >-
    aws elbv2 wait target-in-service --region {{ aws_region }}
    --target-group-arn {{ target_group_arn }} --targets Id={{ instance_id }}
  delegate_to: localhost
  become: false
  changed_when: false

- name: Remove the downloaded tarball
  ansible.builtin.file:
    path: /tmp/app-{{ release_version }}.tar.gz
    state: absent

- name: List installed releases
  ansible.builtin.find:
    paths: "{{ app_root }}/releases"
    file_type: directory
  register: app_release_installed

- name: Prune old releases
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (app_release_installed.files | sort(attribute='mtime', reverse=true))[app_release_keep:] }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename != release_version
